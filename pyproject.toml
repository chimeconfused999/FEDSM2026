[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cinevalve"
version = "1.0.0"
description = "Automated venous valve segmentation and analysis from 2D B-mode ultrasound"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vyom Kumar", email = "vyom.kumar.elpaso@gmail.com" }]
dependencies = [
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "Pillow>=8.0.0",
    "numpy>=1.19.0",
    "opencv-python>=4.5.0",
    "matplotlib>=3.3.0",
    "tqdm>=4.60.0",
    "scikit-image>=0.18.0",
    "scipy>=1.6.0",
    "pandas>=1.2.0",
]

[project.scripts]
cinevalve = "app:main"

[tool.setuptools.packages.find]
include = ["cinevalve*"]
